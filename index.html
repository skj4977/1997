<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="专业大方的企业首页模板">
    <meta name="keywords" content="公司, 网站设计, 专业, 首页">
    <meta name="author" content="Your Name">
    <title>专业大方网站首页</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #1e3d58;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 36px;
            margin: 0;
        }

        nav {
            background-color: #1a2939;
            text-align: center;
            padding: 10px 0;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 20px;
            font-size: 16px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .hero {
            background: url('https://via.placeholder.com/1600x600') no-repeat center center/cover;
            color: #fff;
            text-align: center;
            padding: 100px 0;
        }

        .hero h2 {
            font-size: 48px;
            margin: 0;
        }

        .hero p {
            font-size: 24px;
            margin: 10px 0;
        }

        .cta-button {
            background-color: #fcbf49;
            color: #1e3d58;
            padding: 10px 20px;
            font-size: 18px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
            display: inline-block;
        }

        .cta-button:hover {
            background-color: #f9a826;
        }

        .services {
            display: flex;
            justify-content: space-around;
            padding: 60px 20px;
            background-color: #fff;
        }

        .services .service {
            text-align: center;
            width: 30%;
        }

        .services .service img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
        }

        .services .service h3 {
            font-size: 24px;
            margin: 15px 0;
        }

        footer {
            background-color: #1a2939;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        footer a {
            color: #fcbf49;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>公司名称</h1>
        <p>专业的网站设计与开发</p>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="#about">关于我们</a>
        <a href="#services">服务</a>
        <a href="#contact">联系我们</a>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h2>欢迎来到我们的专业网站</h2>
        <p>我们为您提供最具创新性和高效的解决方案</p>
        <a href="#services" class="cta-button">了解更多</a>
    </section>

    <!-- Services Section -->
    <section id="services" class="services">
        <div class="service">
            <img src="https://via.placeholder.com/100" alt="Service 1">
            <h3>网站设计</h3>
            <p>我们为企业和个人提供定制化的网站设计服务，确保每个网站都具备独特性和用户体验。</p>
        </div>
        <div class="service">
            <img src="https://via.placeholder.com/100" alt="Service 2">
            <h3>网站开发</h3>
            <p>专业的前端和后端开发团队，确保您的网站运行流畅，兼容各大平台。</p>
        </div>
        <div class="service">
            <img src="https://via.placeholder.com/100" alt="Service 3">
            <h3>SEO优化</h3>
            <p>我们的SEO优化服务帮助您的网站提高搜索引擎排名，获得更多的访问流量。</p>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 公司名称. All rights reserved.</p>
        <p>关注我们: <a href="#">微博</a> | <a href="#">微信</a> | <a href="#">LinkedIn</a></p>
    </footer>

</body>
</html>
